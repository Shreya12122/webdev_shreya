
<html>
<head>
<title>Student Registration Form</title>

<style>
body {
 margin: 0;
 padding: 0;
 background-color: white;
 font-family: Arial;        }

 h2 {
  text-align: center;
   margin-top: 20px;
  color: #333;
   }

  form {
  width: 50%;
  margin: 20px auto;
  background: #fff;
 padding: 20px 30px;
 border-radius: 8px;
 box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
 }

 label {
 font-weight: bold;
 color: #444;
 }

 input[type="text"],
 input[type="email"],
 input[type="password"],
 input[type="tel"],
 select,
 textarea {
  width: 100%;
  padding: 10px;
  margin: 8px 0 15px 0;
 border: 1px solid #bbb;
  border-radius: 5px;
 font-size: 14px;
        }

 input[type="radio"] {
  margin-left: 10px;
        }

div input[type="submit"],
 div input[type="button"] {
  padding: 10px 20px;
  margin: 10px 5px;
  font-size: 16px;
  border: none;
   border-radius: 5px;
  cursor: pointer;
  }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
        }

        input[type="button"] {
            background-color: #d9534f;
            color: white;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 10px;
            background-color: #222;
            color: #fff;
        }

        h3 {
            text-align: center;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>Student Registration Form</h2>
    <form action="#" method="post">
<label for="full-name">Full Name:</label>
        <input type="text" id="full-name" name="full-name" placeholder="Enter your full name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter valid email address" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>

        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>

        <label for="course">Course:</label>
        <select id="course" name="course">
            <option value="">-- Select Course --</option>
            <option value="course1">Course 1</option>
            <option value="course2">Course 2</option>
            <option value="course3">Course 3</option>
        </select>

        <label for="contact">Contact No:</label>
        <input type="tel" id="contact" name="contact" placeholder="Enter phone number" required>

        <label for="address">Address:</label>
        <textarea id="address" name="address" rows="4" placeholder="Enter your address" required></textarea>

        <div>
            <input type="submit" value="Register">
            <input type="button" value="Clear" onclick="this.form.reset();">
        </div>
    </form>

    <footer>
        <p>&copy; 2025 Student Registration Portal</p>
    </footer>

    <h3>Shreya Tiwari</h3>
    <h3>2025b15410143</h3>

</body>
</html>
